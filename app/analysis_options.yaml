# تحليل ثابت — إعدادات صارمة نسبيًا تتناسب مع تطبيق محتواه حساس
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  errors:
    # أي TODO من غير تكملة = تحذير، مش خطأ (عشان السقالة تبنى)
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - await_only_futures
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - eol_at_end_of_file
    - no_duplicate_case_values
    - omit_local_variable_types
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_build_context_synchronously
    - use_super_parameters

# flutter pub run build_runner (هيتفعّل في أسبوع ٢ مع freezed/drift)
