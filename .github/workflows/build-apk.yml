name: Build Android APK

# ═══════════════════════════════════════════════════════════════
# يبني APK لأثر (Kotlin + Jetpack Compose) على كل push.
#
# ⚠️ لا يوجد gradle-wrapper.jar في المستودع (ملف ثنائي)، فنولّده
# داخل CI بـ `gradle wrapper --gradle-version 8.9` ثم نستخدمه.
# AGP 8.7.3 يتطلّب Gradle 8.9 — مذكوران معًا في android/build.gradle.kts.
#
# ⚠️ خطوة «نشر سبب الفشل» ليست تجميلًا: لوجات GitHub لا تُقرأ من
# بيئة التطوير هنا (النطاق محجوب)، فننقل سبب الفشل إلى تعليق على
# الـ PR لنتمكن من الإصلاح دون نقل يدوي.
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إصدارات الأدوات
        run: |
          java -version
          gradle --version

      - name: تهيئة Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: صلاحيات التنفيذ
        run: chmod +x gradlew

      - name: APK تصحيح
        id: debug_apk
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-debug.log

      - name: ⚠ نشر سبب الفشل في تعليق على الـ PR
        if: steps.debug_apk.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('gradle-debug.log', 'utf8'); }
            catch (e) { log = '(لا يوجد لوج)'; }
            const lines = log.split('\n');
            const keep = lines.filter(l =>
              /e: |w: |error:|FAILURE:|What went wrong|Could not|Cannot|Unresolved|Exception|Caused by|Deprecated/i.test(l)
            );
            const interesting = (keep.length ? keep : lines).slice(-70).join('\n');
            const body = [
              '## ❌ فشل بناء APK (تصحيح)',
              '',
              'run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '',
              '```',
              interesting.slice(0, 60000),
              '```',
            ].join('\n');
            const branch = (context.ref || '').replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: context.repo.owner + ':' + branch,
              state: 'open',
            });
            if (prs.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body: body,
              });
              core.info('نُشر التعليق على PR #' + prs.data[0].number);
            } else {
              core.warning('لا يوجد PR مفتوح للفرع: ' + branch);
            }

      - name: إيقاف البناء عند الفشل
        if: steps.debug_apk.outcome == 'failure'
        run: |
          echo "❌ فشل assembleDebug — السبب في gradle-debug.log"
          exit 1

      - name: APK إصدار (غير موقّع)
        run: ./gradlew assembleRelease --no-daemon

      - name: حفظ النواتج
        uses: actions/upload-artifact@v4
        with:
          name: athar-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: إرفاق النواتج بالإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
