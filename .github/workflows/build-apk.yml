name: Build Android APK

# ═══════════════════════════════════════════════════════════════
# يبني APK لأثر (Kotlin + Jetpack Compose) على كل push.
#
# ⚠️ لماذا لا يوجد ملف gradle-wrapper.jar في المستودع؟
# لأنه ملف ثنائي، ولا نريد رفع ثنائيات إلى git. فنولّد الـ wrapper
# داخل CI (`gradle wrapper`) ثم نستخدمه. لهذا توجد خطوة صريحة لذلك.
#
# ⚠️ لا نثبّت إصدار Gradle على الأمل: AGP 8.7.3 يتطلّب Gradle 8.9.
# الإصداران مذكوران معًا في android/build.gradle.kts — لا ترفع أحدهما
# بمفرده.
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إصدارات الأدوات
        run: |
          java -version
          gradle --version

      # لا نرفع gradle-wrapper.jar (ثنائي) إلى git — نولّده هنا
      - name: تهيئة Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: صلاحيات التنفيذ
        run: chmod +x gradlew

      # lint قد يفشل البناء على تحذيرات لا نملك رف Geistها محليًا
      - name: APK تصحيح
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK إصدار (غير موقّع)
        run: ./gradlew assembleRelease --no-daemon

      - name: حفظ النواتج
        uses: actions/upload-artifact@v4
        with:
          name: athar-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: إرفاق النواتج بالإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
