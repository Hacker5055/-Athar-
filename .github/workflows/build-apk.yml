name: Build APK

# ═══════════════════════════════════════════════════════════════
# يبني APK جاهزًا للتنزيل على كل push وكل tag.
#
# · debug APK       → دائمًا (بدون أي سرّ)
# · release APK/AAB → يُوقّع تلقائيًا لو الـ ٤ Secrets موجودة، وإلا
#                     يبني release غير موقّع ويكمل (ما يفشلش البناء).
#
# هذا هو المسار المقصود للحصول على ملف APK بدون تثبيت Flutter محليًا.
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: تحليل + اختبارات
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      - name: تحليل
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: اختبارات
        run: flutter test

  build:
    name: بناء APK
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      # مجلد android/ غير مُرفق في المستودع (يُولّد محليًا)،
      # فنولّده هنا في CI قبل البناء.
      - name: توليد مجلد android/
        run: flutter create --platforms=android --org com.athar --project-name athar .

      - name: ⚠ حارس — تأكد إن flutter create لم يلمس lib/
        run: |
          CHANGED="$(git status --porcelain -- app/lib app/pubspec.yaml | wc -l)"
          if [ "$CHANGED" != "0" ]; then
            echo "❌ flutter create عدّل lib/ أو pubspec.yaml:"
            git status --porcelain -- app/lib app/pubspec.yaml
            echo "أصلح بـ: git checkout -- app/lib app/pubspec.yaml"
            exit 1
          fi
          echo "✓ lib/ سليم"

      - name: نقل ملفات الودجت الأصلية
        run: chmod +x tool/setup_android.sh && ./tool/setup_android.sh

      - name: لصق مستقبل الودجت في المانيفست
        run: |
          python3 - <<'PY'
          import re, sys
          path = "android/app/src/main/AndroidManifest.xml"
          src = open(path, encoding="utf-8").read()
          if "AtharWidgetProvider" in src:
              print("موجود مسبقًا"); sys.exit(0)
          snippet = open("native/android/AndroidManifest.snippet.xml", encoding="utf-8").read()
          inner = re.sub(r"<!--.*?-->", "", snippet, flags=re.S).strip()
          out, n = re.subn(r"(\s*)(</application>)", f"\\1{inner}\\1\\2", src, count=1)
          if n != 1:
              print("لم أجد </application>"); sys.exit(1)
          open(path, "w", encoding="utf-8").write(out)
          print("تم")
          PY

      - name: إعداد التوقيع (إن وُجدت الأسرار)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠ لا توجد أسرار توقيع → release APK غير موقّع (صالح للتجربة فقط)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/athar-release.jks
          cat > android/key.properties <<EOF
          storeFile=../app/athar-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✓ التوقيع جاهز"

      - name: release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: release AAB (متجر جوجل)
        run: flutter build appbundle --release

      - name: debug APK
        run: flutter build apk --debug

      - name: حفظ النواتج
        uses: actions/upload-artifact@v4
        with:
          name: athar-apk-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: إرفاق النواتج بالإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
