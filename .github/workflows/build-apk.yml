name: Build Android APK

# ═══════════════════════════════════════════════════════════════
# يبني APK لأثر (Kotlin + Jetpack Compose) على كل push.
#
# ⚠️ لا يوجد gradle-wrapper.jar في المستودع (ملف ثنائي)، فنولّده
# داخل CI بـ `gradle wrapper --gradle-version 8.9` ثم نستخدمه.
# AGP 8.7.3 يتطلّب Gradle 8.9 — مذكوران معًا في android/build.gradle.kts.
#
# ⚠️ خطوة «نشر سبب الفشل» ليست تجميلًا: لوجات GitHub لا تُقرأ من
# بيئة التطوير هنا (النطاق محجوب)، فننقل سبب الفشل إلى تعليق على
# الـ PR لنتمكن من الإصلاح دون نقل يدوي.
# ═══════════════════════════════════════════════════════════════

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: إصدارات الأدوات
        run: |
          java -version
          gradle --version

      - name: تهيئة Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: صلاحيات التنفيذ
        run: chmod +x gradlew

      - name: APK تصحيح
        id: debug_apk
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-debug.log

      - name: حفظ اللوج كـ artifact
        if: steps.debug_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-log-${{ github.sha }}
          path: android/gradle-debug.log
          if-no-files-found: warn
          retention-days: 14

      # ⚠️ نقرأ السبب هنا لا في لوج GitHub: النطاق محجوب عن بيئة
      # التطوير. gh CLI يحلّ رقم الـ PR بنفسه (بحث REST بـ head فشل)،
      # وإن لم يوجد PR ننشئ Issue.
      - name: ⚠ نشر سبب الفشل
        if: steps.debug_apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ❌ فشل بناء APK (تصحيح)"
            echo
            echo "run: $RUN_URL"
            echo
            echo '```'
            grep -E 'e: |error:|FAILURE:|What went wrong|Could not|Cannot|Unresolved|Exception|Caused by|Execution failed' gradle-debug.log \
              | head -60 || echo '(لم يطابق شيء — آخر ٦٠ سطر)'
            echo '```'
            echo
            echo '<details><summary>آخر ٨٠ سطر خام</summary>'
            echo
            echo '```'
            tail -80 gradle-debug.log
            echo '```'
            echo '</details>'
          } > /tmp/why.md

          PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file /tmp/why.md
            echo "✅ نُشر على PR #$PR"
          else
            gh issue create --title "❌ فشل بناء APK — $BRANCH" --body-file /tmp/why.md --label bug 2>/dev/null \
              || echo "⚠️ تعذّر النشر: لا PR ولا صلاحية Issue"
          fi

      - name: إيقاف البناء عند الفشل
        if: steps.debug_apk.outcome == 'failure'
        run: |
          echo "❌ فشل assembleDebug — السبب في gradle-debug.log"
          exit 1

      - name: APK إصدار (غير موقّع)
        run: ./gradlew assembleRelease --no-daemon

      - name: حفظ النواتج
        uses: actions/upload-artifact@v4
        with:
          name: athar-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: إرفاق النواتج بالإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
